<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Freight Forwarder – InJourney Aviation Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#12305c;--blue:#1f5fbf;--blue-l:#e8f0fb;--ink:#2b3036;--gray:#5b6470;--gray-l:#f2f4f7;--line:#dde2e9;--white:#fff;--ok:#1f7a4d;--warn:#a86a00;--bad:#b3392f}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background:var(--gray-l);font-size:14px;display:flex;min-height:100vh}
aside{width:250px;background:var(--white);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
aside img{width:100%;max-width:200px;margin:0 auto 20px;display:block}
.nav{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left;font:inherit;color:var(--gray);cursor:pointer}
.nav b{font-weight:600;font-size:14px}.nav small{font-size:12px}
.nav:hover{background:var(--gray-l)}
.nav.on{background:var(--blue);color:#fff}
.note{margin-top:auto;font-size:11px;color:var(--gray);line-height:1.5}
main{flex:1;min-width:0;padding:28px 32px}
h1{font-size:22px;margin:0 0 4px;color:var(--navy)}
.sub{margin:0 0 22px;color:var(--gray)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--gray)}.kpi strong{display:block;font-size:26px;color:var(--navy)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:20px}
.panel h2{font-size:15px;margin:0 0 14px;color:var(--navy)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--gray)}
.wide{grid-column:1/-1}
input,textarea,select{font:inherit;font-weight:400;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;font-size:13px}
.btn:hover{background:var(--navy);border-color:var(--navy)}
.btn.sec{background:#fff;color:var(--blue)}.btn.sec:hover{background:var(--blue-l);border-color:var(--blue)}
.btn.sm{padding:5px 10px;font-size:12px}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.tools input,.tools select{min-width:180px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:12px;color:var(--gray);font-weight:600;padding:9px 10px;border-bottom:2px solid var(--line);background:var(--gray-l)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td small{color:var(--gray)}
.act{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.s1{background:#fff3dc;color:var(--warn)}.s2{background:var(--blue-l);color:var(--blue)}.s3{background:#e1f3ea;color:var(--ok)}.s4{background:#f9e5e3;color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--gray)}
#toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}aside img{width:130px;margin:0 12px 0 0}.nav small,.note{display:none}main{padding:18px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside>
  <img src="ias_logo.png" alt="InJourney Aviation Services">
  <button class="nav on" data-v="sales"><b>Sales</b><small>Kirim RFQ & unduh jobsheet</small></button>
  <button class="nav" data-v="ops"><b>Operation</b><small>Upload jobsheet cost</small></button>
  <button class="nav" data-v="pc"><b>Project Control</b><small>Monitoring semua RFQ</small></button>
  <p class="note">Mode demo: data tersimpan di browser ini saja (lihat README untuk menghubungkan database bersama).</p>
</aside>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
const KEY='ias_rfq_v1',MAX=3*1024*1024;
const ST={1:['Menunggu cost','s1'],2:['Cost selesai','s2'],3:['Deal','s3'],4:['Tidak deal','s4']};
let db=JSON.parse(localStorage.getItem(KEY)||'[]'),view='sales',q='',fs='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Penyimpanan penuh. Gunakan file lebih kecil.');return false}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
const tag=s=>`<span class="tag ${ST[s][1]}">${ST[s][0]}</span>`;
const rfqCell=r=>`<b>${esc(r.rfq)}</b><br><small>${fmt(r.created)}</small>`;
const routeCell=r=>`${esc(r.pol)} → ${esc(r.pod)}`;
function head(t,s){return `<h1>${t}</h1><p class="sub">${s}</p>`}
function kpis(){const c=n=>db.filter(r=>r.status===n).length;
 return `<div class="kpis"><div class="kpi"><span>Total RFQ</span><strong>${db.length}</strong></div><div class="kpi"><span>Menunggu cost</span><strong>${c(1)}</strong></div><div class="kpi"><span>Cost selesai</span><strong>${c(2)}</strong></div><div class="kpi"><span>Deal</span><strong>${c(3)}</strong></div><div class="kpi"><span>Tidak deal</span><strong>${c(4)}</strong></div></div>`}
function filtered(){return db.filter(r=>(!fs||r.status==fs)&&(!q||[r.rfq,r.company,r.pol,r.pod,r.desc].join(' ').toLowerCase().includes(q.toLowerCase())))}
function tools(){return `<div class="tools"><input id="q" type="search" placeholder="Cari RFQ, perusahaan, POL/POD" value="${esc(q)}" aria-label="Cari"><select id="fs" aria-label="Filter status"><option value="">Semua status</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${fs==k?'selected':''}>${v[0]}</option>`).join('')}</select></div>`}
function bindTools(){const a=$('#q'),b=$('#fs');if(!a)return;a.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};b.onchange=e=>{fs=e.target.value;render()}}
const dl=r=>r.file?`<a class="btn sm" href="${r.file.data}" download="${esc(r.file.name)}">Unduh jobsheet</a>`:'';

function sales(){
 const rows=filtered().map(r=>`<tr><td>${rfqCell(r)}</td><td>${esc(r.company)}</td><td>${routeCell(r)}</td><td>${esc(r.desc)}</td><td>${tag(r.status)}${r.file?`<br><small>Cost: ${fmt(r.costAt)}</small>`:''}</td><td><div class="act">${dl(r)}${r.status===2?`<button class="btn sec sm" data-a="3" data-id="${r.id}">Tandai deal</button><button class="btn sec sm" data-a="4" data-id="${r.id}">Tidak deal</button>`:''}</div></td></tr>`).join('');
 return head('Dashboard Sales','Kirim permintaan cost ke Operation, lalu unduh jobsheet yang sudah dihitung.')+kpis()+
 `<div class="panel"><h2>Kirim RFQ baru ke Operation</h2><form id="f">
 <label>Nomor RFQ<input name="rfq" required placeholder="mis. RFQ-2026-001"></label>
 <label>Nama perusahaan<input name="company" required></label>
 <label>POL (Port of Loading)<input name="pol" required placeholder="mis. Jakarta (CGK)"></label>
 <label>POD (Port of Discharge)<input name="pod" required placeholder="mis. Singapore (SIN)"></label>
 <label class="wide">Deskripsi barang<textarea name="desc" required placeholder="Jenis barang, berat, volume, kemasan, incoterm"></textarea></label>
 <div class="wide"><button class="btn" type="submit">Kirim ke Operation</button></div></form></div>
 <div class="panel"><h2>Daftar RFQ</h2>${tools()}<div class="tw">${rows?`<table><thead><tr><th>RFQ</th><th>Perusahaan</th><th>Rute</th><th>Barang</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Belum ada RFQ. Isi formulir di atas untuk mengirim permintaan cost pertama.</div>'}</div></div>`}

function ops(){
 const rows=filtered().map(r=>`<tr><td>${rfqCell(r)}</td><td>${esc(r.company)}</td><td>${routeCell(r)}</td><td>${esc(r.desc)}</td><td>${tag(r.status)}${r.file?`<br><small>${esc(r.file.name)}</small>`:''}</td><td><div class="act"><label class="btn sm ${r.file?'sec':''}" style="cursor:pointer;flex-direction:row">${r.file?'Ganti file':'Upload jobsheet'}<input type="file" hidden accept=".pdf,.xls,.xlsx,.xlsm" data-up="${r.id}"></label>${dl(r)}</div></td></tr>`).join('');
 return head('Dashboard Operation','Pilih RFQ dari Sales, hitung cost (HPP), lalu upload jobsheet dalam format PDF atau Excel.')+kpis()+
 `<div class="panel"><h2>Permintaan cost dari Sales</h2>${tools()}<div class="tw">${rows?`<table><thead><tr><th>RFQ</th><th>Perusahaan</th><th>Rute</th><th>Barang</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Belum ada permintaan dari Sales.</div>'}</div></div>`}

function pc(){
 const rows=filtered().map(r=>`<tr><td>${rfqCell(r)}</td><td>${esc(r.company)}</td><td>${routeCell(r)}</td><td>${esc(r.desc)}</td><td>${tag(r.status)}</td><td>${r.file?`${esc(r.file.name)}<br><small>${fmt(r.costAt)}</small>`:'<small>Belum ada</small>'}</td></tr>`).join('');
 return head('Dashboard Project Control','Pantau seluruh RFQ dari permintaan cost sampai keputusan customer.')+kpis()+
 `<div class="panel"><h2>Semua RFQ</h2>${tools()}<div class="tools"><button class="btn sec sm" id="csv">Ekspor CSV</button></div><div class="tw">${rows?`<table><thead><tr><th>RFQ</th><th>Perusahaan</th><th>Rute</th><th>Barang</th><th>Status</th><th>Jobsheet</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Tidak ada data yang cocok.</div>'}</div></div>`}

function render(){
 $('#app').innerHTML={sales,ops,pc}[view]();
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 bindTools();
 const f=$('#f');if(f)f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));
  d.rfq=d.rfq.trim();if(db.some(r=>r.rfq.toLowerCase()===d.rfq.toLowerCase()))return toast('Nomor RFQ sudah dipakai.');
  db.unshift({id:Date.now().toString(36),...d,status:1,created:Date.now(),file:null});if(save()){toast('RFQ terkirim ke Operation.');render()}};
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const r=db.find(x=>x.id===b.dataset.id);r.status=+b.dataset.a;save();toast('Status diperbarui.');render()});
 document.querySelectorAll('[data-up]').forEach(i=>i.onchange=()=>{const file=i.files[0];if(!file)return;
  if(!/\.(pdf|xlsx?|xlsm)$/i.test(file.name))return toast('Format harus PDF atau Excel.');
  if(file.size>MAX)return toast('Ukuran file maksimal 3 MB.');
  const rd=new FileReader();rd.onload=()=>{const r=db.find(x=>x.id===i.dataset.up);const old={...r};r.file={name:file.name,data:rd.result};r.costAt=Date.now();if(r.status===1)r.status=2;
   if(save()){toast('Jobsheet terunggah. Sales bisa mengunduhnya.');render()}else Object.assign(r,old)};rd.readAsDataURL(file)});
 const c=$('#csv');if(c)c.onclick=()=>{const h=['RFQ','Perusahaan','POL','POD','Barang','Status','Jobsheet','Dibuat'];
  const l=[h,...filtered().map(r=>[r.rfq,r.company,r.pol,r.pod,r.desc,ST[r.status][0],r.file?r.file.name:'',new Date(r.created).toISOString()])].map(a=>a.map(v=>`"${String(v).replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+l],{type:'text/csv'}));a.download='rfq-monitoring.csv';a.click()};
}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.v;q='';fs='';render()});
render();
</script>
</body>
</html>
